[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "special-little-princess-graphology"
version = "0.1.0"
description = "Hybrid deterministic handwriting measurement engine for YouAreASpecialLittlePrincess"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<6",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "scikit-image>=0.22,<1",
]

[project.optional-dependencies]
signature = ["torch>=2.0"]
dev = ["pytest>=9.1.1,<10", "ruff==0.16.9"]

[project.scripts]
princess-graphology = "princess_graphology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# The Free distribution is the numerical core plus pure contracts. The product
# application (princess_app) runs from the repository with its own lock.
include = ["princess_graphology*", "princess_contracts*"]

[tool.setuptools.package-data]
princess_graphology = ["_feature_contract.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
