name: Prepare isolated documentation handover branch
on:
  push:
    branches: [automation/docs-handover-20261004]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'HMarcusWH/YouAreASpecialLittlePrincess'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize only the authorized documentation branch from the frozen base
        shell: bash
        run: |
          set -euo pipefail
          base=766125e25ccb0c9a4ada4466da5f36e708024e51
          target=docs/mobile-first-maintainer-handover
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git rev-parse origin/$target)" = "$base"
          mkdir -p "$RUNNER_TEMP/handover"
          cp -a .handover-payload "$RUNNER_TEMP/handover/payload"
          cp tools/_handover_prepare.py "$RUNNER_TEMP/handover/prepare.py"
          git checkout --detach "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$RUNNER_TEMP/handover/prepare.py" "$RUNNER_TEMP/handover/payload"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$target"
