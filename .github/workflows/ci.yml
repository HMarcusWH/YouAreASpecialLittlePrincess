name: CI

on:
  push:
    branches: [main, feat/schema-contract-core-metrics]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            constraints: requirements/ci-py310.txt
          - python: '3.11'
            constraints: requirements/ci-py311.txt
          - python: '3.12'
            constraints: requirements/ci-py312.txt
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/${{ matrix.constraints }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pin build toolchain
        run: python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
      - name: Verify build toolchain
        run: |
          python -m pip --version
          python -c 'import setuptools, wheel; assert setuptools.__version__ == "84.0.0"; assert wheel.__version__ == "0.48.0"'
      - run: python -m pip install --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - name: Show resolved dependencies
        run: python -m pip freeze --all
      - run: python tools/generate_feature_contract.py --check
      - run: python tools/compile_premium_interpretation_db.py --check
      - run: python tools/validate_graphology_integrity.py
      - run: python tools/validate_graphology_ontology.py
      - run: python tools/validate_graphology_selector_foundation.py
      - run: python tools/validate_graphology_traditional_rules.py
      - run: python tools/validate_graphology_database.py
      - run: python -m compileall -q src
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - name: Verify graphology research import
        run: python tools/check_graphology_research.py
      - name: Run graphology research regression tests
        run: python tools/test_graphology_research.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/princess-installed" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/princess-installed" python -c 'import json; import numpy as np; from princess_graphology import GraphologyEngine; from princess_graphology.schema_validation import load_contract; assert load_contract()["feature_count"] == 272; assert len(json.loads(GraphologyEngine().analyze(np.full((40, 60), 255, np.uint8)).to_json())["measurements"]) == 64'
