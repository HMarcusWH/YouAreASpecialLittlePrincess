# Generated by tools/render_ci_workflow.py; edit reviewed policy there, not this file.
name: CI

on:
  push:
    branches: [main, feat/schema-contract-core-metrics]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            manifest: requirements/ci-py310.txt
            lock: requirements/ci-py310.lock
          - python: '3.11'
            manifest: requirements/ci-py311.txt
            lock: requirements/ci-py311.lock
          - python: '3.12'
            manifest: requirements/ci-py312.txt
            lock: requirements/ci-py312.lock
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify canonical mandatory workflow
        run: python tools/render_ci_workflow.py --check

      - name: Download reviewed dependency artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-wheelhouse"
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --dest "$RUNNER_TEMP/ci-wheelhouse" \
            -r "${{ matrix.lock }}"

      - name: Install reviewed dependency artifacts
        shell: bash
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-index \
            --no-deps \
            --force-reinstall \
            --find-links "$RUNNER_TEMP/ci-wheelhouse" \
            -r "${{ matrix.lock }}"

      - name: Verify build toolchain
        run: |
          python -m pip --version
          python -c 'import setuptools, wheel; assert setuptools.__version__ == "84.0.0"; assert wheel.__version__ == "0.48.0"'

      - name: Verify project dependency policy and closed locked graph
        run: >-
          python tools/verify_project_dependency_policy.py
          --manifest "${{ matrix.manifest }}"
          --extra dev
          --lock "${{ matrix.lock }}"
          --wheelhouse "$RUNNER_TEMP/ci-wheelhouse"
          --root pip

      - name: Verify backend-reported build requirements
        run: >-
          python tools/verify_project_dependency_policy.py
          --manifest "${{ matrix.manifest }}"
          --extra dev
          --backend-requirements

      - name: Install local project without dependency resolution
        shell: bash
        run: |
          python -m pip install \
            --no-index \
            --no-deps \
            --no-build-isolation \
            -e '.[dev]'

      - name: Verify exact reviewed environment
        run: >-
          python tools/verify_ci_lock.py
          "${{ matrix.lock }}"
          --manifest "${{ matrix.manifest }}"
          --allow "special-little-princess-graphology==0.1.0"

      - run: python -m pip check
      - name: Show resolved dependencies
        run: python -m pip freeze --all
      - run: python tools/generate_feature_contract.py --check
      - run: python tools/compile_premium_interpretation_db.py --check
      - run: python tools/generate_product_contracts.py --check
      - run: python tools/validate_product_contracts.py
      - run: python tools/validate_graphology_integrity.py
      - run: python tools/validate_graphology_ontology.py
      - run: python tools/validate_graphology_selector_foundation.py
      - run: python tools/validate_graphology_traditional_rules.py
      - run: python tools/validate_graphology_database.py
      - run: python tools/validate_consent_protocol.py
      - run: python -m compileall -q src
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - name: Exercise consent invariant fault-injection controls
        run: python tools/test_contract_faults.py
      - name: Exercise product-contract fault-injection controls
        run: python tools/test_product_contract_faults.py
      - name: Verify graphology research import
        run: python tools/check_graphology_research.py
      - name: Run graphology research regression tests
        run: python tools/test_graphology_research.py
      - name: Build wheel offline
        run: python -m pip wheel . --no-deps --no-build-isolation --no-index --wheel-dir dist
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --target "$RUNNER_TEMP/princess-installed" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/princess-installed" python -c 'import json; import numpy as np; from princess_contracts import contract_identity, free_feature_ids; from princess_graphology import GraphologyEngine; from princess_graphology.schema_validation import load_contract; assert load_contract()["feature_count"] == 272; assert contract_identity()[0] == "1.0.0"; assert len(free_feature_ids()) == 64; assert len(json.loads(GraphologyEngine().analyze(np.full((40, 60), 255, np.uint8)).to_json())["measurements"]) == 64'
