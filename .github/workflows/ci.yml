name: CI

on:
  push:
    branches: [main, feat/schema-contract-core-metrics]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python tools/generate_feature_contract.py --check
      - run: python -m compileall -q src
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/princess-installed" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/princess-installed" python -c 'import json; import numpy as np; from princess_graphology import GraphologyEngine; from princess_graphology.schema_validation import load_contract; assert load_contract()["feature_count"] == 272; assert len(json.loads(GraphologyEngine().analyze(np.full((40, 60), 255, np.uint8)).to_json())["measurements"]) == 64'
