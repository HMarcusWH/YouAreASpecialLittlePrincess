name: T00 branch formatter

on:
  push:
    branches: [chore/t00-green-baseline]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/t00-green-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply safe Ruff fixes and formatting
        shell: bash
        run: |
          files=(
            tools/validate_graphology_selector_foundation.py
            tools/validate_graphology_database.py
            tools/validate_graphology_integrity.py
            tests/test_graphology_repair_regressions.py
            tools/validate_graphology_traditional_rules.py
            tools/validate_graphology_ontology.py
            tools/compile_premium_interpretation_db.py
            tests/test_graphology_database.py
            tests/test_graphology_selector_foundation.py
            tests/test_graphology_traditional_rules.py
            tests/test_graphology_ontology.py
            tools/graphology_db_common.py
          )
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/validate_graphology_selector_foundation.py \
            tools/validate_graphology_database.py \
            tools/validate_graphology_integrity.py \
            tests/test_graphology_repair_regressions.py \
            tools/validate_graphology_traditional_rules.py \
            tools/validate_graphology_ontology.py \
            tools/compile_premium_interpretation_db.py \
            tests/test_graphology_database.py \
            tests/test_graphology_selector_foundation.py \
            tests/test_graphology_traditional_rules.py \
            tests/test_graphology_ontology.py \
            tools/graphology_db_common.py
          git commit -m "style: normalize T26 tooling for Ruff"
          git push origin HEAD:chore/t00-green-baseline
