name: T24 Premium restore roadmap generator

on:
  push:
    branches: [fix/T24-premium-attempt-reconciliation]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate roadmap backlog
        run: python docs/roadmap/plan_tools.py --write
      - name: Emit generated backlog
        shell: bash
        run: |
          echo PRINCESS_BACKLOG_BEGIN
          base64 -w0 docs/roadmap/06-agent-backlog.md
          echo
          echo PRINCESS_BACKLOG_END
