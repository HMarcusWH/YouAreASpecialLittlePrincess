name: Temporary v2 fixture regeneration

on:
  push:
    branches: [fix/inktrospect-contract-repair]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/inktrospect-contract-repair
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python tools/generate_report_fixtures.py
      - name: Commit generated fixtures
        shell: bash
        run: |
          if git diff --quiet -- fixtures/reports; then
            echo "No generated fixture changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fixtures/reports
          git commit -m "chore: regenerate v2 report fixtures"
          git push origin HEAD:fix/inktrospect-contract-repair
