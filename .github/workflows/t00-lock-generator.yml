name: T00 hashed lock generator

on:
  push:
    branches: [chore/t00-green-baseline]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/t00-green-baseline

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python tools/generate_ci_lock.py requirements/ci-py310.txt requirements/ci-py310.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python tools/generate_ci_lock.py requirements/ci-py311.txt requirements/ci-py311.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python tools/generate_ci_lock.py requirements/ci-py312.txt requirements/ci-py312.lock

      - name: Commit reviewed-lock candidates
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/ci-py310.lock requirements/ci-py311.lock requirements/ci-py312.lock
          git commit -m "chore: generate artifact-hashed CI locks"
          git push origin HEAD:chore/t00-green-baseline
