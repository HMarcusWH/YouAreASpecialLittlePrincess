name: Temporary T29 dependency and Android build spike

on:
  push:
    branches: [task/T29-native-foundation]

permissions:
  contents: write

jobs:
  resolve-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/T29-native-foundation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.2'
      - run: corepack enable && corepack install
      - run: pnpm install --no-frozen-lockfile
      - name: Resolve Expo SDK 57 compatible native modules
        run: >-
          pnpm --filter @princess/mobile exec expo install
          expo-dev-client expo-secure-store expo-image-picker expo-image-manipulator
          expo-file-system expo-sharing expo-linking expo-notifications expo-build-properties
          expo-constants expo-splash-screen expo-status-bar expo-system-ui expo-web-browser
          react-native-safe-area-context react-native-screens expo-iap@5.6.3
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @princess/mobile typecheck
      - run: pnpm --filter @princess/mobile test
      - run: pnpm --filter @princess/mobile config:public
      - name: Generate Android native project
        run: pnpm --filter @princess/mobile exec expo prebuild --clean --no-install --platform android
      - name: Compile Android development APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Commit resolved dependency graph
        shell: bash
        run: |
          git add apps/mobile/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(T29): lock Expo native compatibility dependencies"
          git push origin HEAD:task/T29-native-foundation
