name: PR12 invariant workbench

on:
  push:
    branches: [task/T03-pr12-invariant-audit]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1667d72cffed9c46c361bfb7bf273535c6f9417b
          persist-credentials: false
      - name: Export committed baseline without Git credentials or working data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr12-audit"
          git archive --format=tar.gz --output="$RUNNER_TEMP/pr12-audit/source-1667d72.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/pr12-audit/BASELINE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr12-audit-baseline
          path: ${{ runner.temp }}/pr12-audit/
          retention-days: 2
          if-no-files-found: error
