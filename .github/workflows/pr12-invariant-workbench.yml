name: PR12 invariant workbench

on:
  push:
    branches: [task/T03-pr12-invariant-audit]
    paths: [.pr12-audit/READY]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1667d72cffed9c46c361bfb7bf273535c6f9417b
          path: source
          persist-credentials: false
      - name: Validate reviewed text delta and create unattached repair commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -I - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = '1667d72cffed9c46c361bfb7bf273535c6f9417b'
          expected = '9eec4f752bbe54fb9a15a2430b6480c58dea298a37e7b765cf458f96eeec5a27'
          allowed = {
              '.github/workflows/ci.yml', 'contracts/consent/README.md',
              'contracts/consent/v1/notices.json',
              'contracts/consent/v1/schemas/notice-registry.schema.json',
              'contracts/consent/v1/schemas/release-evidence.schema.json',
              'docs/ci/PR12_INVARIANTS.json', 'docs/ci/T00_BASELINE.md',
              'docs/privacy/README.md', 'docs/privacy/collection-protocol.md',
              'docs/privacy/purposes-and-consent.md', 'docs/privacy/validated-release-boundary.md',
              'requirements/README.md', 'requirements/ci-targets.json',
              'tests/test_ci_lock.py', 'tests/test_ci_workflow_contract.py',
              'tests/test_consent_invariants.py', 'tests/test_consent_protocol.py',
              'tools/consent_primitives.py', 'tools/render_ci_workflow.py',
              'tools/test_contract_faults.py', 'tools/validate_consent_protocol.py',
              'tools/verify_project_dependency_policy.py',
          }
          chunks = sorted(Path('transport/.pr12-audit').glob('delta-*.b64'))
          assert len(chunks) == 4
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          assert len(encoded) == 44584
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == expected, 'transport hash mismatch'
          decoder = lzma.LZMADecompressor(memlimit=134217728)
          raw = decoder.decompress(packed, max_length=2097152)
          assert decoder.eof and not decoder.unused_data and len(raw) == 136956
          records = json.loads(raw)
          assert len(records) == len(allowed) and {r['path'] for r in records} == allowed
          tree, digests = [], {}
          for record in records:
              path = Path('source') / record['path']
              assert not path.is_symlink()
              if record['base_sha256'] is None:
                  assert not path.exists()
                  original = ''
              else:
                  original_bytes = path.read_bytes()
                  assert hashlib.sha256(original_bytes).hexdigest() == record['base_sha256'], record['path']
                  original = original_bytes.decode('utf-8')
              lines, output, cursor = original.splitlines(keepends=True), [], 0
              for start, end, replacement in record['edits']:
                  assert type(start) is int and type(end) is int and cursor <= start <= end <= len(lines)
                  assert isinstance(replacement, str)
                  output.extend(lines[cursor:start])
                  output.append(replacement)
                  cursor = end
              output.extend(lines[cursor:])
              content = ''.join(output)
              actual = hashlib.sha256(content.encode('utf-8')).hexdigest()
              assert actual == record['sha256'], record['path']
              tree.append({'path': record['path'], 'mode': '100644', 'type': 'blob', 'content': content})
              digests[record['path']] = actual
          api = 'https://api.github.com/repos/HMarcusWH/YouAreASpecialLittlePrincess/'
          def request(path, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = Request(api + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              }, method='GET' if body is None else 'POST')
              with urlopen(req, timeout=60) as response:
                  return json.load(response)
          assert request('pulls/12')['head']['sha'] == base, 'PR head changed; do not overwrite concurrent work'
          parent = request('git/commits/' + base)
          created_tree = request('git/trees', {'base_tree': parent['tree']['sha'], 'tree': tree})
          commit = request('git/commits', {
              'message': 'refactor: compile consent release authority and enforce mandatory CI\n\nClose review-13 invariant families with immutable compiled policy, authoritative consent, complete lineage/asset/evidence dependencies, iterative provenance, generated mandatory CI and adversarial controls. Preserve pending owner gates and all numerical/research files.\n\nLocal locked Python 3.12: 633 tests pass; nine exercised fault-removal controls pass; full offline build and validators pass. Separate matrix evidence required on this exact commit.',
              'tree': created_tree['sha'], 'parents': [base],
          })
          result = {'commit_sha': commit['sha'], 'tree_sha': created_tree['sha'], 'parent_sha': base,
                    'transport_sha256': expected, 'files': digests, 'refs_updated': False}
          directory = Path(os.environ['RUNNER_TEMP']) / 'pr12-repair-result'
          directory.mkdir()
          (directory / 'result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print('Created unattached repair commit:', commit['sha'])
          print('No branch refs or PR state changed by this job.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr12-repair-result
          path: ${{ runner.temp }}/pr12-repair-result/
          retention-days: 2
          if-no-files-found: error
