name: Temporary T18 generation

on:
  push:
    branches: [task/T18-deterministic-comparison]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/T18-deterministic-comparison
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/generate_product_contracts.py
      - run: python tools/generate_comparison_fixtures.py
      - run: python docs/roadmap/plan_tools.py --write
      - name: Commit generated artifacts
        shell: bash
        run: |
          git add contracts/http/openapi-components.json \
                  contracts/product/v1/manifest.json \
                  contracts/product/v1/fixtures/valid/comparison.json \
                  schema/method_capabilities/resolved.json \
                  src/princess_contracts/generated.py \
                  packages/contracts/src/generated.ts \
                  fixtures/comparisons \
                  docs/roadmap/06-agent-backlog.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(T18): regenerate comparison contracts and fixtures"
          git push origin HEAD:task/T18-deterministic-comparison
