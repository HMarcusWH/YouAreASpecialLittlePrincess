name: T17 lockfile resolver

on:
  push:
    branches: [task/T17-web-accessibility-qualification]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.2'
      - run: corepack enable && corepack install
      - name: Resolve reviewed accessibility dependency
        run: pnpm install --no-frozen-lockfile
      - name: Emit generated lockfile
        shell: bash
        run: |
          echo PRINCESS_LOCKFILE_BEGIN
          base64 -w0 pnpm-lock.yaml
          echo
          echo PRINCESS_LOCKFILE_END
