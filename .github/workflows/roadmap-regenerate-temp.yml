# trigger third-pass regeneration
name: Temporary roadmap regeneration

on:
  push:
    branches: [docs/agent-roadmap-v2-multiplatform]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/agent-roadmap-v2-multiplatform
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Regenerate and validate roadmap
        run: |
          python docs/roadmap/plan_tools.py --write
          python docs/roadmap/plan_tools.py --check
          python -m unittest discover -s docs/roadmap -p 'test_plan_tools.py'
          git diff --check
      - name: Commit generated backlog
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/06-agent-backlog.md
          git commit -m "docs: regenerate backlog after third Codex repair"
          git push origin HEAD:docs/agent-roadmap-v2-multiplatform
