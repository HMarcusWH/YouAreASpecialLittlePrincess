name: Runtime topology

on:
  pull_request:
    paths:
      - "infra/runtime/**"
      - "infra/recovery/**"
      - "infra/operations/**"
      - "infra/environments/**"
      - "src/princess_app/**"
      - "apps/api/**"
      - "apps/workers/**"
      - "apps/render/**"
      - "packages/**"
      - "requirements/app-py312.*"
      - "tools/verify_runtime_lock.py"
      - ".dockerignore"
      - ".github/workflows/runtime.yml"
  push:
    branches: [main]
    paths:
      - "infra/runtime/**"
      - "infra/recovery/**"
      - "infra/operations/**"
      - "infra/environments/**"
      - "src/princess_app/**"
      - "apps/api/**"
      - "apps/workers/**"
      - "apps/render/**"
      - "packages/**"
      - "requirements/app-py312.*"
      - "tools/verify_runtime_lock.py"
      - ".dockerignore"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PRINCESS_BACKEND_IMAGE: princess-backend:${{ github.sha }}
      PRINCESS_EXPORT_IMAGE: princess-export:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify reviewed source-tree runtime lock
        run: python3 tools/verify_runtime_lock.py
      - name: Build backend runtime (reviewed amd64 target)
        run: docker build --platform linux/amd64 --target backend-runtime -f infra/runtime/Dockerfile -t "$PRINCESS_BACKEND_IMAGE" .
      - name: Build export runtime (reviewed amd64 target)
        run: docker build --platform linux/amd64 --target export-runtime -f infra/runtime/Dockerfile -t "$PRINCESS_EXPORT_IMAGE" .
      - name: Verify final-image authority and tool surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect -f '{{.Config.User}}' "$PRINCESS_BACKEND_IMAGE")" = "10001:10001"
          test "$(docker image inspect -f '{{.Config.User}}' "$PRINCESS_EXPORT_IMAGE")" = "10001:10001"
          docker run --rm --entrypoint sh "$PRINCESS_BACKEND_IMAGE" -c '
            ! command -v node
            ! command -v pip
            ! command -v ruff
            python -c "import fastapi, sqlalchemy, princess_graphology, princess_app"
          '
          docker run --rm --entrypoint sh "$PRINCESS_EXPORT_IMAGE" -c '
            set -e
            node --version | grep -Fx "v22.22.2"
            test -x "$PRINCESS_CHROMIUM"
            ! command -v npm
            ! command -v pip
          '
          docker run --rm --entrypoint node "$PRINCESS_EXPORT_IMAGE" -e \
            "require.resolve('playwright-core',{paths:['/opt/princess/apps/render']})"
      - name: Qualify raw Chromium launch inside the final export image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --tmpfs /tmp:rw,exec,nosuid,size=512m --shm-size=512m \
            --entrypoint /usr/bin/env "$PRINCESS_EXPORT_IMAGE" \
            -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp PRINCESS_CHROMIUM=/opt/chromium/chrome \
            node -e '
              const { chromium } = require("/opt/princess/apps/render/node_modules/playwright-core");
              (async () => {
                const browser = await chromium.launch({ executablePath: process.env.PRINCESS_CHROMIUM });
                await browser.close();
              })().catch((error) => { console.error(error); process.exit(1); });
            '
      - name: Render real PDF and PNG inside the final export image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/a4.json
          import json
          view=json.load(open("fixtures/reports/view.export-v2-no-image.json"))
          print(json.dumps({"view":view,"layout":"A4","locale":"en","generated_at":"2026-09-29T12:00:00Z"}))
          PY
          python3 - <<'PY' >/tmp/card.json
          import json
          view=json.load(open("fixtures/reports/view.share-v2.json"))
          print(json.dumps({"view":view,"layout":"CARD_SQUARE","locale":"en","generated_at":"2026-09-29T12:00:00Z"}))
          PY
          docker run --rm -i --read-only --tmpfs /tmp:rw,exec,nosuid,size=512m --shm-size=512m             -e HOME=/tmp --entrypoint python "$PRINCESS_EXPORT_IMAGE" -c             'import json,sys; from princess_app.adapters.render import SubprocessRenderer; p=json.load(sys.stdin); sys.stdout.buffer.write(SubprocessRenderer().render(p["view"],p["layout"],p["locale"],p["generated_at"]))'             </tmp/a4.json >/tmp/report.pdf
          docker run --rm -i --read-only --tmpfs /tmp:rw,exec,nosuid,size=512m --shm-size=512m             -e HOME=/tmp --entrypoint python "$PRINCESS_EXPORT_IMAGE" -c             'import json,sys; from princess_app.adapters.render import SubprocessRenderer; p=json.load(sys.stdin); sys.stdout.buffer.write(SubprocessRenderer().render(p["view"],p["layout"],p["locale"],p["generated_at"]))'             </tmp/card.json >/tmp/card.png
          python3 - <<'PY'
          assert open("/tmp/report.pdf","rb").read(5) == b"%PDF-"
          assert open("/tmp/card.png","rb").read(8) == b"\x89PNG\r\n\x1a\n"
          PY
      - name: Start disposable role-separated topology
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f infra/runtime/compose.smoke.yaml down -v --remove-orphans' EXIT
          docker compose -f infra/runtime/compose.smoke.yaml up -d --wait db
          docker compose -f infra/runtime/compose.smoke.yaml run --rm migrations
          docker compose -f infra/runtime/compose.smoke.yaml run --rm role-bootstrap
          docker compose -f infra/runtime/compose.smoke.yaml up -d --wait             api analysis-worker premium-worker export-worker notification-worker
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          # Compose can mark the health probe healthy while the forwarded
          # connection still resets during startup. Retry transport faults
          # only; a real HTTP failure or wrong response still fails closed.
          for path in ("live", "ready"):
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:18000/health/{path}", timeout=5) as r:
                          assert r.status == 200 and json.load(r) == {"status": "ok"}
                      break
                  except urllib.error.HTTPError:
                      raise
                  except (OSError, urllib.error.URLError):
                      if attempt == 11:
                          raise
                      time.sleep(0.5)
          PY

          snapshot="$(docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api -m princess_api.ops snapshot)"
          printf '%s\n' "$snapshot" | python3 -c '
          import json,sys
          doc=json.load(sys.stdin)
          assert doc["version"]=="operational-snapshot/1"
          assert doc["environment"]=="test"
          assert isinstance(doc["schema_revision"],str) and doc["schema_revision"]
          assert set(doc["capabilities"])=={"premium_generation","commerce","uploads","sharing","notifications"}
          assert all(set(o)=={"source","category","state","count","oldest_age_s","max_attempts"} for o in doc["observations"])
          '
          docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api \
            -m princess_api.ops verify-disabled --switch commerce --switch premium_generation
          docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api \
            -m princess_api.ops check --policy /opt/princess/infra/operations/alert-policy.test.json

          telemetry_json="$(docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api \
            -m princess_api.ops emit-telemetry)"
          printf '%s\n' "$telemetry_json" | python3 -c '
          import json,sys
          doc=json.load(sys.stdin)
          assert doc["result"]=="PASS" and doc["alert_count"]==0
          assert doc["metric_counts"]["operational.count"]==26
          assert doc["metric_counts"]["operational.capability"]==5
          assert "operational.alert" not in doc["metric_counts"]
          '

          docker compose -f infra/runtime/compose.smoke.yaml stop analysis-worker
          docker compose -f infra/runtime/compose.smoke.yaml exec -T db psql -U princess_admin -d princess_test \
            -v ON_ERROR_STOP=1 -c "
              INSERT INTO app.principal (principal_id, kind, created_at)
              VALUES ('prn_ops_alert', 'ACCOUNT', now() - interval '2 minutes');
              INSERT INTO app.job
                (job_id, kind, owner_id, subject_ref, state, dedupe_key, created_at, updated_at)
              VALUES
                ('job_ops_alert', 'analysis', 'prn_ops_alert', 'subject_ops', 'QUEUED',
                 'ops-alert', now() - interval '2 minutes', now() - interval '2 minutes');
            "
          set +e
          alert_json="$(docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api \
            -m princess_api.ops check --policy /opt/princess/infra/operations/alert-policy.test.json)"
          alert_status=$?
          set -e
          test "$alert_status" -eq 2
          printf '%s\n' "$alert_json" | python3 -c '
          import json,sys
          doc=json.load(sys.stdin)
          assert doc["result"]=="ALERT"
          assert [a["alert_code"] for a in doc["alerts"]]==["test.analysis_queue_stale"]
          '

          telemetry_alert_json="$(docker compose -f infra/runtime/compose.smoke.yaml run --rm --entrypoint python api \
            -m princess_api.ops emit-telemetry --policy /opt/princess/infra/operations/alert-policy.test.json)"
          printf '%s\n' "$telemetry_alert_json" | python3 -c '
          import json,sys
          doc=json.load(sys.stdin)
          assert doc["result"]=="PASS" and doc["alert_count"]==1
          assert doc["metric_counts"]["operational.count"]==26
          assert doc["metric_counts"]["operational.alert"]==1
          '

          docker compose -f infra/runtime/compose.smoke.yaml stop db
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:18000/health/live", timeout=5) as r:
              assert r.status == 200 and json.load(r) == {"status":"ok"}
          for _ in range(15):
              try:
                  urllib.request.urlopen("http://127.0.0.1:18000/health/ready", timeout=3)
              except urllib.error.HTTPError as exc:
                  if exc.code == 503 and json.load(exc) == {"status":"not_ready"}:
                      break
              time.sleep(1)
          else:
              raise SystemExit("readiness did not fail closed after PostgreSQL stopped")
          PY
      - name: Rehearse real PostgreSQL backup/restore
        env:
          PRINCESS_RECOVERY_ALLOW_RESET: "1"
          PRINCESS_RECOVERY_WORKDIR: ${{ runner.temp }}/princess-recovery-${{ github.sha }}
        run: |
          python3 infra/recovery/run_restore_drill.py
          python3 infra/recovery/receipt.py validate "$PRINCESS_RECOVERY_WORKDIR/recovery-receipt.json"
      - name: Upload privacy-safe recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t24-recovery-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/princess-recovery-${{ github.sha }}/recovery-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Final-image source syntax check without filesystem writes
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint python "$PRINCESS_BACKEND_IMAGE" -c '
          from pathlib import Path
          roots = (Path("/opt/princess/src"), Path("/opt/princess/apps"))
          files = [path for root in roots for path in root.rglob("*.py")]
          for path in files:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print(f"compiled {len(files)} source files without writing bytecode")
          '
      - name: Record local image identifiers
        run: |
          docker image inspect -f 'backend {{.Id}}' "$PRINCESS_BACKEND_IMAGE"
          docker image inspect -f 'export {{.Id}}' "$PRINCESS_EXPORT_IMAGE"
