name: princess-recovery-drill

services:
  db:
    image: postgres@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    environment:
      POSTGRES_USER: princess_admin
      POSTGRES_PASSWORD: recovery-only-admin
      POSTGRES_DB: princess_test
    volumes:
      - ${PRINCESS_RECOVERY_WORKDIR}:/recovery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U princess_admin -d princess_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrations:
    image: ${PRINCESS_BACKEND_IMAGE}
    environment:
      PRINCESS_ENV: test
      PRINCESS_COMPONENT: migrations
      PRINCESS_MIGRATION_DATABASE_URL: postgresql://princess_admin:recovery-only-admin@db:5432/princess_test?connect_timeout=2
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  role-bootstrap:
    image: postgres@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    command: ["psql", "postgresql://princess_admin:recovery-only-admin@db:5432/princess_test", "-f", "/runtime/smoke_roles.sql"]
    volumes:
      - ../runtime/smoke_roles.sql:/runtime/smoke_roles.sql:ro
    depends_on:
      db:
        condition: service_healthy

  api-tool:
    image: ${PRINCESS_BACKEND_IMAGE}
    entrypoint: ["python"]
    environment:
      PRINCESS_ENV: test
      PRINCESS_COMPONENT: api
      PRINCESS_DATABASE_URL: postgresql://princess_smoke_api:smoke-only-api@db:5432/princess_test?connect_timeout=2
      PRINCESS_SESSION_SECRET: recovery-session-secret-0123456789
      PRINCESS_IDENTITY_AUDIENCE: princess-recovery
      PRINCESS_STORAGE_SIGNING_KEY: recovery-storage-key-0123456789
      PRINCESS_LOCAL_STORAGE_DIR: /recovery/data/storage
      PRINCESS_TOMBSTONE_DIR: /recovery/data/tombstones
      PRINCESS_PUBLIC_API_BASE: http://recovery.invalid
    volumes:
      - .:/recovery-tools:ro
      - ${PRINCESS_RECOVERY_WORKDIR}:/recovery
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  worker-tool:
    image: ${PRINCESS_BACKEND_IMAGE}
    entrypoint: ["python"]
    environment:
      PRINCESS_ENV: test
      PRINCESS_COMPONENT: analysis_worker
      PRINCESS_DATABASE_URL: postgresql://princess_smoke_worker:smoke-only-worker@db:5432/princess_test?connect_timeout=2
      PRINCESS_STORAGE_READ_KEY: recovery-storage-key-0123456789
      PRINCESS_LOCAL_STORAGE_DIR: /recovery/data/storage
      PRINCESS_TOMBSTONE_DIR: /recovery/data/tombstones
    volumes:
      - .:/recovery-tools:ro
      - ${PRINCESS_RECOVERY_WORKDIR}:/recovery
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
