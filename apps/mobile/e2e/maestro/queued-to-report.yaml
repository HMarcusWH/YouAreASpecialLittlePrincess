# After the runner releases the analysis worker, the recovered work screen polls the same run and opens the saved
# Free report. Asserts the real Dossier and its saved evidence; no Premium or reference-statistic claim is made.
# The photo was not retained (optional retention left off), so the honest "no longer stored" state is expected.
# The saved report is long (full metric grid, then evidence tables), so each scroll may take minutes on an emulator.
appId: se.inktrospect.development
name: The same run completes into the saved Dossier
---
- extendedWaitUntil:
    visible: "Your report"
    timeout: 300000
- assertVisible: "Revision 1"
- scrollUntilVisible:
    element: "The source image is no longer stored, so only the saved measurements are shown."
    direction: DOWN
    timeout: 300000
- scrollUntilVisible:
    element: "Baseline traces"
    direction: DOWN
    timeout: 300000
- scrollUntilVisible:
    element: "Compare with another report"
    direction: DOWN
    timeout: 300000
- scrollUntilVisible:
    element: "Report a problem"
    direction: DOWN
    timeout: 300000
